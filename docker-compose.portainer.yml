services:
  # ─── Docker Vulnerability Scanner ────────────────────────────────────────
  scanner:
    build: .
    container_name: docker-vuln-scanner
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - scanner_data:/data
    environment:
      - TZ=Europe/Amsterdam
      - GRYPE_DB_CACHE_DIR=/data/grype-db
      - SCANNER_DB_PATH=/data/scanner.db
      - SCAN_CRON=0 3 * * *
    networks:
      - inspector

  # ─── Portainer CE ─────────────────────────────────────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"   # HTTP UI
      - "9443:9443"   # HTTPS UI (self-signed cert)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - inspector

volumes:
  scanner_data:
  portainer_data:

networks:
  inspector:
    driver: bridge
