<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Docker Vulnerability Scanner{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    .font-mono-id { font-family: 'Courier New', Courier, monospace; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <!-- Nav -->
  <nav class="bg-gray-900 border-b border-gray-800 px-6 py-3 flex items-center gap-6">
    <a href="/" class="text-white font-semibold text-lg tracking-tight">🐳 VulnScanner</a>
    <a href="/" class="text-gray-400 hover:text-white text-sm">Dashboard</a>

    <a href="/api/findings" class="text-gray-400 hover:text-white text-sm">API</a>

  <main class="px-6 py-6 max-w-screen-xl mx-auto">
    {% block content %}{% endblock %}

</body>
</html>
